name: AAPL scan
on:
  schedule:
    # every 5 min, Mon-Fri, 13:00-22:00 UTC (covers 9:00 AM - 5:00 PM New York in winter and summer)
    - cron: "*/5 13-22 * * 1-5"
  workflow_dispatch: {}
concurrency:
  group: aapl-scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Refresh backtest weekly (Mondays before the open)
        if: github.event_name == 'workflow_dispatch'
        run: python scanner/backtest.py
      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CAPITAL: ${{ secrets.CAPITAL }}
          RISK_PCT: ${{ secrets.RISK_PCT }}
        run: python scanner/run.py
      - name: Save results
        run: |
          git config user.name "aapl-edge-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "scan $(date -u +%FT%TZ)" && git pull --rebase -q && git push -q)
